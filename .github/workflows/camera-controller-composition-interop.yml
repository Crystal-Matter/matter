name: Camera Controller composition interoperability

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/camera-controller-composition-interop.yml'
      - 'e2e/spec/webrtc_requestor_spec.cr'
      - 'examples/matter_webrtc_requestor_device.cr'
      - 'src/matter/device_type.cr'

jobs:
  official-chip-tool-camera-controller:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Verify Camera Controller topology and CASE signaling with official chip-tool
        run: ./test --focused --service webrtc-requestor -- e2e/spec/webrtc_requestor_spec.cr
      - name: Upload protocol logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: camera-controller-logs
          path: tmp/e2e/logs/*.log
          if-no-files-found: warn

name: Matter 1.6 official multi-ecosystem JFA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/sdk-jfadmin-multi.yml
      - e2e/interop/sdk_jfadmin_multi.py
      - e2e/interop/sdk_jfa_vvs_live.py
      - e2e/interop/TC_SDK_JFA_VVS.py
      - e2e/interop/sdk_jfc_jcm_driver.cr
      - e2e/interop/jfa_vvs_dcl_mirror.py
      - e2e/interop/sdk_cert_identity.py
      - e2e/interop/sdk_jfadmin_issuer_fixture.cr
      - e2e/interop/joint_fabric_rpc_bridge.py
      - examples/support/joint_fabric_administrator_device.cr
      - src/matter/cluster/joint_fabric_administrator.cr
      - src/matter/controller/joint_commissioning.cr

jobs:
  tc-jfadmin-2-x:
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v5
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.22.0
      - name: Prepare discovery and SDK dependencies
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            avahi-daemon avahi-utils dbus iproute2 libavahi-client-dev libdbus-1-dev \
            libglib2.0-dev libcairo2-dev libgirepository1.0-dev libssl-dev \
            pkg-config clang ninja-build cmake
          interface=$(ip -o -4 route show default | awk '{print $5; exit}')
          sudo sysctl -w "net.ipv6.conf.${interface}.disable_ipv6=0"
          sudo ip -6 addr add fd42:4d41:5454::2/64 dev "$interface"
          sudo service dbus start
          sudo service avahi-daemon start
          avahi-daemon --check
      - name: Build Crystal JFA
        run: |
          shards install --ignore-crystal-version --skip-postinstall --skip-executables
          mkdir -p tmp
          crystal build examples/matter_joint_fabric_administrator_device.cr -o tmp/matter_jfa
          crystal build e2e/interop/sdk_jfadmin_issuer_fixture.cr -o tmp/sdk_jfadmin_issuer_fixture
          crystal build e2e/interop/sdk_jfc_jcm_driver.cr -o tmp/sdk_jfc_jcm_driver
      - name: Build official Matter 1.6 JFC, JFA, all-clusters and Python controller
        timeout-minutes: 115
        run: |
          git clone --depth 1 --branch v1.6.0.0 \
            https://github.com/project-chip/connectedhomeip.git tmp/connectedhomeip
          cd tmp/connectedhomeip
          # The pinned JFA example hosts the JFA server on endpoint 1 but
          # advertises only Color Temperature Light in its DeviceTypeList.
          # Correct that SDK fixture before generation; fail if its shape changes.
          python3 - <<'PY'
          import json
          from pathlib import Path

          zap = Path("examples/jf-admin-app/jfa-common/jfa-app.zap")
          data = json.loads(zap.read_text())
          jfa_endpoint_id = 1
          color_temperature_light_type = 0x010C
          jfa_device_type = 0x0130
          jfa_cluster_id = 0x0753
          matter_profile_id = 0x0103
          endpoints = [endpoint for endpoint in data["endpoints"]
                       if endpoint["endpointId"] == jfa_endpoint_id]
          assert len(endpoints) == 1, "Expected one SDK JFA endpoint"
          endpoint_type = data["endpointTypes"][endpoints[0]["endpointTypeIndex"]]
          assert endpoint_type["deviceIdentifiers"] == [color_temperature_light_type]
          assert endpoint_type["deviceVersions"] == [4]
          assert [device["code"] for device in endpoint_type["deviceTypes"]] == [color_temperature_light_type]
          assert any(cluster["code"] == jfa_cluster_id and cluster["side"] == "server"
                     and cluster["enabled"] == 1 for cluster in endpoint_type["clusters"])
          endpoint_type["deviceTypes"].append({
              "code": jfa_device_type,
              "profileId": matter_profile_id,
              "label": "MA-joint-fabric-administrator",
              "name": "MA-joint-fabric-administrator",
              "deviceTypeOrder": 1,
          })
          endpoint_type["deviceIdentifiers"].append(jfa_device_type)
          endpoint_type["deviceVersions"].append(1)
          zap.write_text(json.dumps(data, indent=2) + "\n")
          PY
          ./scripts/checkout_submodules.py --shallow --platform linux
          python3 - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("scripts/setup/environment.json").read_text())
          config["cipd_package_files"] = [
              package for package in config["cipd_package_files"]
              if not package.endswith("/arm.json")
          ]
          Path("objdir-jf-environment.json").write_text(json.dumps(config))
          PY
          export PW_CONFIG_FILE=objdir-jf-environment.json
          set +u
          source scripts/bootstrap.sh -p linux
          set -u
          ./scripts/build/build_examples.py \
            --target linux-x64-jf-control-app-ipv6only-no-ble-no-wifi-clang \
            --target linux-x64-jf-admin-app-ipv6only-no-ble-no-wifi-clang \
            --target linux-x64-all-clusters-ipv6only-no-ble-no-wifi-clang \
            --build-profile debug build --copy-artifacts-to objdir-jf
          ./scripts/build_python.sh --enable_ble false --enable_webrtc false \
            --include_pytest_deps no --install_virtual_env out/python_env
          out/python_env/bin/pip install -r src/python_testing/requirements.txt
          gn gen out/host
          ninja -C out/host chip-cert
          out/python_env/bin/python3 -c 'import matter.clusters, matter.testing.runner, mobly'
      - name: Run unmodified TC_JFADMIN_2_2 against Crystal joining JFA
        id: jfadmin_2_2
        continue-on-error: true
        timeout-minutes: 25
        env:
          MATTER_JFA_IP_ADDRESS: 'fd42:4d41:5454::2'
        run: |
          python3 e2e/interop/sdk_jfadmin_multi.py \
            --sdk tmp/connectedhomeip --jfa tmp/matter_jfa \
            --case TC_JFADMIN_2_2 --log-dir tmp/interop-jfadmin-multi
      - name: Run unmodified TC_JFADMIN_2_1 against Crystal Anchor JFA
        id: jfadmin_2_1
        continue-on-error: true
        timeout-minutes: 25
        env:
          MATTER_JFA_IP_ADDRESS: 'fd42:4d41:5454::2'
        run: |
          python3 e2e/interop/sdk_jfadmin_multi.py \
            --sdk tmp/connectedhomeip --jfa tmp/matter_jfa \
            --case TC_JFADMIN_2_1 --log-dir tmp/interop-jfadmin-multi
      - name: Check SDK VVS JFA trust and consent through its AddICAC limit
        id: jfadmin_vvs
        continue-on-error: true
        timeout-minutes: 28
        env:
          MATTER_JFA_IP_ADDRESS: 'fd42:4d41:5454::2'
        run: |
          python3 e2e/interop/sdk_jfa_vvs_live.py \
            --sdk tmp/connectedhomeip --jfa tmp/matter_jfa \
            --driver tmp/sdk_jfc_jcm_driver \
            --log-dir tmp/interop-jfadmin-vvs
      - name: Require official JFADMIN and VVS JFA boundary cases to pass
        if: always()
        env:
          JFADMIN_2_2: ${{ steps.jfadmin_2_2.outcome }}
          JFADMIN_2_1: ${{ steps.jfadmin_2_1.outcome }}
          JFADMIN_VVS: ${{ steps.jfadmin_vvs.outcome }}
        run: |
          echo "TC_JFADMIN_2_2: $JFADMIN_2_2"
          echo "TC_JFADMIN_2_1: $JFADMIN_2_1"
          echo "SDK VVS JFA: $JFADMIN_VVS"
          test "$JFADMIN_2_2" = success && test "$JFADMIN_2_1" = success && \
            test "$JFADMIN_VVS" = success
      - name: Upload official test and device logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-jfadmin-multi-logs
          path: |
            tmp/interop-jfadmin-multi/
            tmp/interop-jfadmin-vvs/
          if-no-files-found: warn

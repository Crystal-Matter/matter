name: Push AV catalog interoperability

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/push-av-catalog-interop.yml'
      - 'e2e/spec/push_av_stream_transport_spec.cr'
      - 'examples/matter_push_av_stream_transport_device.cr'
      - 'src/matter/cluster/push_av_stream_transport*'

jobs:
  official-chip-tool-push-av-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Verify nonempty Push AV catalog with official chip-tool
        run: ./test --focused --service push-av-stream-transport -- e2e/spec/push_av_stream_transport_spec.cr
      - name: Upload protocol logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: push-av-catalog-logs
          path: tmp/e2e/logs/*.log
          if-no-files-found: warn

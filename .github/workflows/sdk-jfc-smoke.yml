name: Matter 1.6 SDK JFC smoke

on:
  workflow_dispatch:

jobs:
  official-jfc-crystal-switch:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: crystal-lang/install-crystal@v1
      - name: Free space for the official SDK build
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h .
      - name: Install SDK discovery dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            avahi-daemon avahi-utils dbus libavahi-client-dev libdbus-1-dev \
            libglib2.0-dev libssl-dev pkg-config clang ninja-build cmake iproute2
          interface="$(ip -o -4 route show default | awk 'NR == 1 {print $5}')"
          test -n "${interface}"
          sudo sysctl -w "net.ipv6.conf.${interface}.disable_ipv6=0"
          sudo ip -6 addr add 'fd42:4d41:5454::2/64' dev "${interface}"
          ip -6 addr show dev "${interface}"
          sudo service dbus start
          sudo service avahi-daemon start
          avahi-daemon --check
          df -h .
      - name: Install Crystal dependencies
        run: shards install --ignore-crystal-version --skip-postinstall --skip-executables
      - name: Build official SDK JFC and JFA, then commission Crystal switch
        timeout-minutes: 110
        run: timeout --signal=TERM --kill-after=30s 105m bash e2e/interop/sdk_jfc_switch_smoke.sh
      - name: Upload build and process logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-jfc-smoke-logs
          path: tmp/interop-sdk-jfc/*.log
          if-no-files-found: warn

name: ICD registration atomicity regression

on:
  push:
    branches:
      - codex/icd-registration-atomicity

jobs:
  focused_spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.22.0
      - run: shards install --ignore-crystal-version --skip-postinstall --skip-executables
      - run: crystal spec spec/cluster/icd_registration_atomicity_spec.cr -v --error-trace

name: Matter 1.6 SDK JFC to Crystal JFA JCM

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/sdk-jfc-jcm.yml'
      - 'e2e/interop/**'
      - 'examples/matter_joint_fabric_administrator_device.cr'
      - 'examples/support/joint_fabric_administrator_device.cr'
      - 'src/matter/commissioning/**'

jobs:
  official-jfc-crystal-jfa-jcm:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: crystal-lang/install-crystal@v1
      - name: Free space for the official SDK build
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h .
      - name: Install SDK discovery and harness dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            avahi-daemon avahi-utils dbus libavahi-client-dev libdbus-1-dev \
            libglib2.0-dev libssl-dev pkg-config clang ninja-build cmake python3-yaml iproute2
          sudo service dbus start
          sudo service avahi-daemon start
          avahi-daemon --check
          python3 -c 'import yaml'
      - name: Install Crystal dependencies
        run: shards install --ignore-crystal-version --skip-postinstall --skip-executables
      - name: Validate bridge and live harness
        run: python3 -m unittest discover -s e2e/interop -p 'test_*.py'
      - name: Build official SDK and run live JCM
        timeout-minutes: 110
        env:
          MATTER_INTEROP_SCENARIO: jcm
          MATTER_JFA_IP_ADDRESS: 'fd42:4d41:5454::2'
        run: |
          interface="$(ip -o -4 route show default | awk 'NR == 1 {print $5}')"
          test -n "${interface}"
          sudo sysctl -w "net.ipv6.conf.${interface}.disable_ipv6=0"
          sudo ip -6 addr add "${MATTER_JFA_IP_ADDRESS}/64" dev "${interface}"
          ip -6 addr show dev "${interface}"
          timeout --signal=TERM --kill-after=30s 105m bash e2e/interop/sdk_jfc_switch_smoke.sh
      - name: Upload process and protocol logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-jfc-crystal-jfa-jcm-logs
          path: tmp/interop-sdk-jfc/*.log
          if-no-files-found: warn

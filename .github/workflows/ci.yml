name: CI
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
jobs:
  coding_standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.22.0
      - name: Install Dependencies
        run: shards install
      # ameba declares no executable in its shard.yml, so `shards install` never
      # produces bin/ameba; build it the way the repository's own bin/ameba was built.
      - name: Build Ameba
        run: mkdir -p bin && crystal build lib/ameba/bin/ameba.cr -o bin/ameba
      - name: Ameba
        run: ./bin/ameba
      - name: Format
        run: crystal tool format --check
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.22.0
      - name: Install Dependencies
        run: shards install --ignore-crystal-version --skip-postinstall --skip-executables
      # Type-check everything the spec suite does not: the ten example devices,
      # the in-repo chip-tool, the storage CLI and the end-to-end spec helpers.
      - name: Build library entrypoints
        run: |
          crystal build --no-codegen src/matter.cr
          crystal build --no-codegen src/matter/controller.cr
          crystal build --no-codegen src/matter/storage/cli.cr
      - name: Build examples
        run: |
          for example in examples/matter_*_device.cr examples/chip-tool.cr examples/device_validation.cr; do
            echo "==> $example"
            crystal build --no-codegen "$example"
          done
      - name: Build end-to-end specs
        run: crystal build --no-codegen e2e/spec/e2e_helper.cr
      - name: Build storage CLI target
        run: shards build matter-storage
  end_to_end_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.22.0
      - name: Install Dependencies
        run: shards install --ignore-crystal-version --skip-postinstall --skip-executables
      - name: Create bin folder
        run: mkdir -p ./bin/
      - name: Build chip-tool
        run: crystal build ./examples/chip-tool.cr -o ./bin/chip-tool --error-trace
      - name: Validate
        run: ./examples/run_validation.sh --chip-tool ./bin/chip-tool
  docker_interoperability:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Commission example devices with official chip-tool
        run: ./test --e2e-only
      - name: Upload device logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-interoperability-logs
          path: tmp/e2e/logs/
          if-no-files-found: warn
  test:
    strategy:
      fail-fast: false
      matrix:
        experimental: [false]
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        crystal:
          - 1.22.0
        include:
          - experimental: true
            os: ubuntu-latest
            crystal: nightly
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}
      - name: Install dependencies
        run: shards install --ignore-crystal-version --skip-postinstall --skip-executables
      - name: Run tests
        run: crystal spec -v --error-trace

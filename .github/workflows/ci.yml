name: CI
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
jobs:
  coding_standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.22.0
      - name: Install Dependencies
        run: shards install
      # ameba declares no executable in its shard.yml, so `shards install` never
      # produces bin/ameba; build it the way the repository's own bin/ameba was built.
      - name: Build Ameba
        run: mkdir -p bin && crystal build lib/ameba/bin/ameba.cr -o bin/ameba
      - name: Ameba
        run: ./bin/ameba
      - name: Format
        run: crystal tool format --check
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.22.0
      - name: Install Dependencies
        run: shards install --ignore-crystal-version --skip-postinstall --skip-executables
      # Type-check everything the spec suite does not: the ten example devices,
      # the in-repo chip-tool, the storage CLI and the end-to-end spec helpers.
      - name: Build library entrypoints
        run: |
          crystal build --no-codegen src/matter.cr
          crystal build --no-codegen src/matter/controller.cr
          crystal build --no-codegen src/matter/storage/cli.cr
      - name: Build examples
        run: |
          for example in examples/matter_*_device.cr examples/chip-tool.cr examples/device_validation.cr; do
            echo "==> $example"
            crystal build --no-codegen "$example"
          done
      - name: Build end-to-end specs
        run: crystal build --no-codegen e2e/spec/e2e_helper.cr
      - name: Build storage CLI target
        run: shards build matter-storage
  end_to_end_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.22.0
      - name: Install Dependencies
        run: shards install --ignore-crystal-version --skip-postinstall --skip-executables
      - name: Create bin folder
        run: mkdir -p ./bin/
      - name: Build chip-tool
        run: crystal build ./examples/chip-tool.cr -o ./bin/chip-tool --error-trace
      - name: Validate
        run: ./examples/run_validation.sh --chip-tool ./bin/chip-tool
  docker_interoperability:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Commission example devices with official chip-tool
        run: ./test --e2e-only
      - name: Upload device logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-interoperability-logs
          path: tmp/e2e/logs/
          if-no-files-found: warn
  postgres_storage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: matter
          POSTGRES_PASSWORD: matter
          POSTGRES_DB: matter_storage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U matter -d matter_storage_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.22.0
      - name: Install dependencies
        run: shards install --ignore-crystal-version --skip-postinstall --skip-executables
      - name: Run PostgreSQL storage contract
        env:
          MATTER_TEST_POSTGRES_URL: postgres://matter:matter@127.0.0.1:5432/matter_storage_test
        run: crystal spec spec-postgres/postgres_backend_spec.cr -v --error-trace
  test:
    strategy:
      fail-fast: false
      matrix:
        experimental: [false]
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        crystal:
          - 1.22.0
        include:
          - experimental: true
            os: ubuntu-latest
            crystal: nightly
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}
      - name: Install SQLite native library on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install sqlite3:x64-windows
          $sqliteRoot = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed\x64-windows'
          "CRYSTAL_LIBRARY_PATH=$(crystal env CRYSTAL_LIBRARY_PATH);$sqliteRoot\lib" >> $env:GITHUB_ENV
          "$sqliteRoot\bin" >> $env:GITHUB_PATH
      - name: Install dependencies
        run: shards install --ignore-crystal-version --skip-postinstall --skip-executables
      - name: Run tests
        if: runner.os != 'Linux'
        run: crystal spec -v --error-trace
      # Crystal 1.22 can produce a full-suite Ubuntu binary with malformed ELF
      # symbol versions once it grows large enough. Keep every spec, but link
      # two smaller binaries so they load reliably.
      - name: Run tests on Ubuntu in two batches
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t spec_files < <(find spec -type f -name '*_spec.cr' | sort)
          test "${#spec_files[@]}" -ge 2
          half=$(( (${#spec_files[@]} + 1) / 2 ))
          echo "Running ${half} of ${#spec_files[@]} spec files in batch 1"
          crystal spec -v --error-trace "${spec_files[@]:0:half}"
          echo "Running $((${#spec_files[@]} - half)) of ${#spec_files[@]} spec files in batch 2"
          crystal spec -v --error-trace "${spec_files[@]:half}"

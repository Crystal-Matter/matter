      MATTER_E2E_RUN_ID: ${MATTER_E2E_RUN_ID:-manual}
    volumes:
      - e2e-logs:/e2e/logs
    networks:
      - matter

  tests:
    build:
      context: .
      dockerfile: e2e/Dockerfile
      target: tests
      args:

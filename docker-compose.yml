  # Official connectedhomeip server used to verify Crystal-originated groupcast.
  official-group-recipient:
    image: ${MATTER_E2E_TESTS_IMAGE:-matter-e2e-tests}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until [ -f /e2e/logs/official-group-recipient-${MATTER_E2E_RUN_ID:-manual}.start ]; do sleep 0.2; done
        exec /usr/bin/chip-all-clusters-app --discriminator 3841 --passcode 20202021 --KVS /tmp/official-group-recipient.kvs

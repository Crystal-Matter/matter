# End-to-end test environment: every example device runs in its own container
# and the `tests` service (official chip-tool + crystal) commissions and drives
# them over the compose network. Use `./test` to run everything.
#
# chip-tool is IPv6-only, so the network has an IPv6 (ULA) subnet and devices
# advertise their fd00:6d61:7474::/64 address over mDNS.
name: matter-e2e

# The device image is built once (by the `switch` service) and shared by every
# other device service; building it per service races on the compiler cache.
x-device: &device
  image: matter-e2e-device
  volumes:
    - e2e-logs:/e2e/logs
  networks:
    - matter
  # Healthy once the device has printed its pairing code (see device-entrypoint.sh).
  healthcheck:
    test: ["CMD-SHELL", "grep -q 'chip-tool pairing code 1' /e2e/logs/$${E2E_DEVICE}.log"]
    interval: 2s
    timeout: 2s
    retries: 30
    start_period: 5s

services:
  switch:
    <<: *device
    build:
      context: .
      dockerfile: e2e/Dockerfile
      target: device
    environment:
      E2E_DEVICE: matter_switch

  shared-switch:
    <<: *device
    environment:
      E2E_DEVICE: matter_shared_switch
      E2E_BINARY: matter_switch

  resource-monitoring:
    <<: *device
    environment:
      E2E_DEVICE: matter_resource_monitoring

  time-zone:
    <<: *device
    environment:
      E2E_DEVICE: matter_time_zone

  tcp-large-payload:
    <<: *device
    environment:
      E2E_DEVICE: matter_tcp_large_payload

  tls-certificates:
    <<: *device
    environment:
      E2E_DEVICE: matter_tls_certificate_management

  tls-client-management:
    <<: *device
    environment:
      E2E_DEVICE: matter_tls_client_management

  joint-fabric-administrator:
    <<: *device
    environment:
      E2E_DEVICE: matter_joint_fabric_administrator

  joint-fabric-anchor:
    <<: *device
    environment:
      E2E_DEVICE: matter_joint_fabric_anchor
      E2E_BINARY: matter_joint_fabric_administrator
      MATTER_JFA_PROVISIONED_ANCHOR: "1"
      MATTER_JFA_BOOTSTRAP_STATE_PATH: /e2e/logs/matter_joint_fabric_anchor.bootstrap.yml
      MATTER_JFA_VID_TRUST_ROOT_PATH: /e2e/logs/matter_joint_fabric_anchor.trust-root.tlv,/e2e/logs/matter_joint_fabric_anchor.third-trust-root.tlv
      MATTER_JFA_ANCHOR_OPERATIONAL_PORT: "5540"
      MATTER_JFA_JCM_REQUEST_PATH: /e2e/logs/matter_joint_fabric_anchor.jcm-rpc.yml
      MATTER_JFA_ALLOW_TRANSFER: "1"
      MATTER_JFA_TRANSFER_CANDIDATE_IDS: a103=b102
      MATTER_JFA_TRANSFER_PEERS: a103=joint-fabric-joiner,a104=joint-fabric-third,b102=joint-fabric-joiner,a201=joint-fabric-migration-target
      MATTER_JFA_COMMAND_PATH: /e2e/logs/matter_joint_fabric_anchor.command.yml

  joint-fabric-joiner:
    <<: *device
    environment:
      E2E_DEVICE: matter_joint_fabric_joiner
      E2E_BINARY: matter_joint_fabric_administrator
      MATTER_JFA_PROVISIONED_ANCHOR: "1"
      MATTER_JFA_BOOTSTRAP_STATE_PATH: /e2e/logs/matter_joint_fabric_joiner.bootstrap.yml
      MATTER_JFA_VID_TRUST_ROOT_PATH: /e2e/logs/matter_joint_fabric_joiner.trust-root.tlv
      MATTER_JFA_ALLOW_JCM: "1"
      MATTER_JFA_ANCHOR_OPERATIONAL_PORT: "5540"
      MATTER_JFA_TRANSFER_PEERS: a102=joint-fabric-anchor,a104=joint-fabric-third,b201=joint-fabric-migration-target
      MATTER_JFA_KEEP_BOOTSTRAP_DATASTORE: "1"
      MATTER_JFA_CONSENTED_MIGRATIONS: b201
      MATTER_JFA_MIGRATION_TEST_TRUST: "1"
      MATTER_JFA_ANCHOR_NODE_ID: a102
      MATTER_JFA_COMMAND_PATH: /e2e/logs/matter_joint_fabric_joiner.command.yml
      MATTER_JFA_CONSENTED_REMOVALS: a102
      MATTER_JFA_OUTGOING_INSPECTION_PATH: /e2e/logs/matter_joint_fabric_anchor.command.yml

  joint-fabric-third:
    <<: *device
    environment:
      E2E_DEVICE: matter_joint_fabric_third
      E2E_BINARY: matter_joint_fabric_administrator
      MATTER_JFA_PROVISIONED_ANCHOR: "1"
      MATTER_JFA_BOOTSTRAP_STATE_PATH: /e2e/logs/matter_joint_fabric_third.bootstrap.yml
      MATTER_JFA_VID_TRUST_ROOT_PATH: /e2e/logs/matter_joint_fabric_third.trust-root.tlv,/e2e/logs/matter_joint_fabric_third.new-anchor-root.tlv
      MATTER_JFA_ALLOW_JCM: "1"
      MATTER_JFA_ANCHOR_OPERATIONAL_PORT: "5540"
      MATTER_JFA_TRANSFER_PEERS: a102=joint-fabric-anchor,a103=joint-fabric-joiner,b102=joint-fabric-joiner
      MATTER_JFA_KEEP_BOOTSTRAP_DATASTORE: "1"
      MATTER_JFA_ANCHOR_NODE_ID: a102
      MATTER_JFA_COMMAND_PATH: /e2e/logs/matter_joint_fabric_third.command.yml

  joint-fabric-refresh-anchor:
    <<: *device
    environment:
      E2E_DEVICE: matter_joint_fabric_refresh_anchor
      E2E_BINARY: matter_joint_fabric_administrator
      MATTER_JFA_PROVISIONED_ANCHOR: "1"
      MATTER_JFA_BOOTSTRAP_STATE_PATH: /e2e/logs/matter_joint_fabric_refresh_anchor.bootstrap.yml
      MATTER_JFA_TRANSFER_PEERS: c201=joint-fabric-refresh-target

  joint-fabric-refresh-target:
    <<: *device
    environment:
      E2E_DEVICE: matter_joint_fabric_refresh_target
      E2E_BINARY: matter_switch

  joint-fabric-lifecycle-anchor:
    <<: *device
    environment:
      E2E_DEVICE: matter_joint_fabric_lifecycle_anchor
      E2E_BINARY: matter_joint_fabric_administrator
      MATTER_JFA_PROVISIONED_ANCHOR: "1"
      MATTER_JFA_BOOTSTRAP_STATE_PATH: /e2e/logs/matter_joint_fabric_lifecycle_anchor.bootstrap.yml
      MATTER_JFA_TRANSFER_PEERS: c401=joint-fabric-lifecycle-target

  joint-fabric-lifecycle-target:
    <<: *device
    environment:
      E2E_DEVICE: matter_joint_fabric_lifecycle_target
      E2E_BINARY: matter_switch

  joint-fabric-migration-target:
    <<: *device
    environment:
      E2E_DEVICE: matter_joint_fabric_migration_target
      E2E_BINARY: matter_switch

  level-control:
    <<: *device
    environment:
      E2E_DEVICE: matter_level_control

  scenes-fabric:
    <<: *device
    environment:
      E2E_DEVICE: matter_scenes_fabric
      E2E_BINARY: matter_level_control

  door-lock:
    <<: *device
    environment:
      E2E_DEVICE: matter_door_lock

  temperature-sensor:
    <<: *device
    environment:
      E2E_DEVICE: matter_temperature_sensor

  pressure-sensor:
    <<: *device
    environment:
      E2E_DEVICE: matter_pressure_sensor

  temperature-control:
    <<: *device
    environment:
      E2E_DEVICE: matter_temperature_control

  humidity-sensor:
    <<: *device
    environment:
      E2E_DEVICE: matter_humidity_sensor

  soil-sensor:
    <<: *device
    environment:
      E2E_DEVICE: matter_soil_sensor

  contact-sensor:
    <<: *device
    environment:
      E2E_DEVICE: matter_contact_sensor

  motion-sensor:
    <<: *device
    environment:
      E2E_DEVICE: matter_motion_sensor

  ambient-light-sensor:
    <<: *device
    environment:
      E2E_DEVICE: matter_ambient_light_sensor

  air-conditioner:
    <<: *device
    environment:
      E2E_DEVICE: matter_air_conditioner

  bridge:
    <<: *device
    environment:
      E2E_DEVICE: matter_bridge

  ecosystem-bridge:
    <<: *device
    environment:
      E2E_DEVICE: matter_ecosystem_bridge

  commissioner-control:
    <<: *device
    environment:
      E2E_DEVICE: matter_commissioner_control

  wifi-management:
    <<: *device
    environment:
      E2E_DEVICE: matter_wifi_management

  wake-on-lan:
    <<: *device
    environment:
      E2E_DEVICE: matter_wake_on_lan

  thread-directory:
    <<: *device
    environment:
      E2E_DEVICE: matter_thread_directory

  thread-border-router:
    <<: *device
    environment:
      E2E_DEVICE: matter_thread_border_router

  operational-state:
    <<: *device
    environment:
      E2E_DEVICE: matter_operational_state

  # Official connectedhomeip server used to verify Crystal-originated groupcast.
  official-group-recipient:
    image: matter-e2e-tests
    entrypoint: ["/usr/bin/chip-all-clusters-app"]
    command: ["--discriminator", "3841", "--passcode", "20202021", "--KVS", "/tmp/official-group-recipient.kvs"]
    networks:
      - matter

  tests:
    build:
      context: .
      dockerfile: e2e/Dockerfile
      target: tests
    image: matter-e2e-tests
    depends_on:
      switch: { condition: service_healthy }
      shared-switch: { condition: service_healthy }
      time-zone: { condition: service_healthy }
      tcp-large-payload: { condition: service_healthy }
      joint-fabric-administrator: { condition: service_healthy }
      joint-fabric-anchor: { condition: service_healthy }
      joint-fabric-joiner: { condition: service_healthy }
      joint-fabric-third: { condition: service_healthy }
      joint-fabric-refresh-anchor: { condition: service_healthy }
      joint-fabric-refresh-target: { condition: service_healthy }
      joint-fabric-lifecycle-anchor: { condition: service_healthy }
      joint-fabric-lifecycle-target: { condition: service_healthy }
      joint-fabric-migration-target: { condition: service_healthy }
      level-control: { condition: service_healthy }
      scenes-fabric: { condition: service_healthy }
      door-lock: { condition: service_healthy }
      temperature-sensor: { condition: service_healthy }
      pressure-sensor: { condition: service_healthy }
      temperature-control: { condition: service_healthy }
      humidity-sensor: { condition: service_healthy }
      soil-sensor: { condition: service_healthy }
      contact-sensor: { condition: service_healthy }
      motion-sensor: { condition: service_healthy }
      ambient-light-sensor: { condition: service_healthy }
      air-conditioner: { condition: service_healthy }
      bridge: { condition: service_healthy }
      ecosystem-bridge: { condition: service_healthy }
      commissioner-control: { condition: service_healthy }
      wifi-management: { condition: service_healthy }
      thread-border-router: { condition: service_healthy }
      thread-directory: { condition: service_healthy }
      operational-state: { condition: service_healthy }
      official-group-recipient: { condition: service_started }
    environment:
      E2E_RUN_UNIT: ${E2E_RUN_UNIT:-1}
      E2E_RUN_E2E: ${E2E_RUN_E2E:-1}
      E2E_SPEC_ARGS: ${E2E_SPEC_ARGS:-}
      # "code" commissions via mDNS discovery (`chip-tool pairing code`),
      # "address" via `chip-tool pairing already-discovered` using the device's IPv6 address.
      E2E_PAIRING: ${E2E_PAIRING:-code}
      E2E_LOG_DIR: /e2e/logs
    volumes:
      - e2e-logs:/e2e/logs
      - crystal-cache:/root/.cache/crystal
    networks:
      - matter

networks:
  matter:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:6d61:7474::/64

volumes:
  e2e-logs:
  crystal-cache:
